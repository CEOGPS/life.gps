<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Free Document Maker</title>
  <style>
    body {
      width: 320px;
      height: 100px;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      background-color: #f9fafb;
    }
    button {
      width: 90%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s ease-in-out;
    }
    button:hover {
      background: #1e40af;
    }
  </style>
</head>
<body>
  <button onclick="window.open('https://www.freedocumentmaker.com', '_blank')">
    Launch Free Document Maker
  </button>
</body>
</html>
