  <div class="conta2iner">
    <h2 class="text-center mb-4">Email Checker</h2>
    <form id="shortUrlForm">
      <div class="mb-3">
        <label for="email" class="form-label">Email:</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">
          <i class='fas fa-redo fa-spin' style='display:none'></i>

  <div class="container" data-rate-us>
        <style>
  .full-stars {
    text-align: center;
  }
  .full-stars .rating-group {
    display: inline-flex;
  }
  .full-stars input {
    position: absolute;
    left: -9999px;
  }
  .full-stars label {
    margin: 0;
    cursor: pointer;
  }
  .full-stars label a svg {
    margin: 2px;
    height: 30px;
    width: 30px;
    fill: #ff8400;
    transition: fill 0.3s;
  }
  .full-stars input:checked ~ label a svg {
    fill: #ffc711;
  }
  .full-stars .rating-group:hover label a svg {
    fill: #ff8400;
  }
  .full-stars .rating-group input:hover ~ label a svg {
    fill: #ffc711;
  }
</style>
<hr style="border: 0; border-top: 2px solid #bbb; opacity: 0.25" />
