name = "lifeos1"
compatibility_date = "2026-07-01"
pages_build_output_dir = "dist"

# KV Namespace for app state persistence
kv_namespaces = [
  { binding = "LIFEOS_KV", id = "lifeos_kv_id_placeholder" }
]

# R2 Bucket for file storage
r2_buckets = [
  { binding = "LIFEOS_R2", bucket_name = "lifeos-storage" }
]

# Workers AI binding
[ai]
binding = "AI"
